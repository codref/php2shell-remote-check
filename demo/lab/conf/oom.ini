; php2shell remote-check lab — vulnerable node (PHP 8.4.26, low memory limit).
; A small memory_limit lets the upload-progress handler reach OOM
; deterministically; otherwise-unbounded input limits keep only memory the bound
; (mirrors PHP's tests/basic/oom_rfc1867_upload_progress.phpt).
memory_limit = 4M
post_max_size = 1G
upload_max_filesize = 1G
max_file_uploads = 1000000
max_input_vars = 10000000
max_multipart_body_parts = 10000000
max_input_time = -1
html_errors = 0
display_errors = 1
error_reporting = E_ALL
session.upload_progress.enabled = 1
session.upload_progress.freq = 1
session.upload_progress.min_freq = 0
session.use_strict_mode = 0
session.save_path = /tmp
